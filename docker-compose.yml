# Two containers: the Next.js app, and Caddy in front of it for TLS.
#
# Caddy obtains and renews Let's Encrypt certificates on its own, so there is
# no certbot cron job to forget about.

services:
  web:
    build:
      context: .
      args:
        # Read from .env on the server. These are compiled into the client
        # bundle, so changing one needs a rebuild, not just a restart.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    restart: unless-stopped
    # Deliberately not published to the host: only Caddy can reach the app, so
    # nobody can bypass TLS by hitting the VPS IP on port 3000.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Server-side only. Never prefixed NEXT_PUBLIC_, so they stay out of the
      # browser bundle and out of the image.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates persist across restarts. Without this Caddy re-issues on
      # every deploy and will hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - web
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
